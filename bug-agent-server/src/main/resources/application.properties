spring.application.name=bug-agent-server

#AI config
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.0
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s
logging.level.org.springframework.ai=debug
logging.level.org.springframework.ai.retry=debug
agent.target-app.path=/home/pedro/IdeaProjects/demo-agente-bugs/target-app

# MCP Client (conecta no codebase-mcp-server via Streamable HTTP)
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=bug-agent-server
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.codebase-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.codebase-server.endpoint=/mcp